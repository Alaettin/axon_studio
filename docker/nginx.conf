# Auslieferung des Hubs: eine statische Flaeche, mehr braucht er nicht.
#
# Der Hub spricht ausschliesslich mit Supabase. Es gibt keinen eigenen Server, keine
# Datenbank, keinen Proxy. Deshalb nginx und nicht Node: ein Container von rund 10 MB statt
# 200, und auf einem Server mit 1 GB Speicher und acht weiteren Diensten zaehlt das.

server {
  # Sliplane erkennt den Port selbst, verlangt aber, dass der Container auf allen
  # Schnittstellen lauscht und nicht nur auf localhost.
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Gesundheitspfad. Sliplane haelt eine fehlgeschlagene Auslieferung damit von der
  # laufenden Fassung fern, statt sie zu ersetzen.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Die gebuendelten Dateien tragen einen Hash im Namen. Sie aendern sich nie unter
  # demselben Namen und duerfen deshalb ewig im Zwischenspeicher liegen.
  # Nur `add_header`, **nicht** zusaetzlich `expires`: beide setzen Cache-Control, und die
  # Antwort trug den Kopf dann zweimal mit verschiedenem Inhalt. Kein Browser stolpert
  # darueber, aber eine mehrdeutige Antwort ist keine Antwort.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    # =404 statt Rueckfall: eine fehlende gehashte Datei ist ein Fehler und darf nicht als
    # index.html zurueckkommen, sonst sieht der Browser HTML, wo er JavaScript erwartet.
    try_files $uri =404;
  }

  # index.html dagegen **nie** zwischenspeichern. Sie ist die einzige Datei, die auf die
  # gehashten Namen zeigt: liegt eine alte Fassung im Browser, laedt sie nach dem
  # Ausrollen Dateien, die es nicht mehr gibt, und die Anwendung bleibt weiss.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # Der SPA-Rueckfall. Ohne ihn antwortet nginx auf /profil, /verwaltung/nutzer und
  # /zustimmung beim Neuladen mit 404, denn diese Pfade sind Wege im Browser und keine
  # Dateien. Die Abfrage bleibt dabei erhalten, das ist fuer `?authorization_id=` der
  # Zustimmungsseite die Bedingung.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

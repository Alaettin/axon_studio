# Die Sicherheitskopfzeilen, an genau einer Stelle.
#
# **Warum eine eigene Datei und kein Block im server{}:** `add_header` vererbt sich nur
# nach unten, solange die untere Ebene selbst keins setzt. Sobald ein `location` ein
# eigenes `add_header` traegt, verliert es *alle* Koepfe der aeusseren Ebene, still und
# ohne Warnung. Drei der vier `location` in `nginx.conf` setzen Cache-Control oder
# Content-Type. Ein `include` an jeder dieser Stellen ist deshalb die einzige Form, die
# nicht die Haelfte der Antworten ungeschuetzt laesst.
#
# Gemessen wird das mit `node scripts/kopfzeilen-pruefen.mjs <adresse>`: es fragt die
# Wege einzeln ab, gerade weil der Fehler nur an einzelnen Wegen auftraete.

# Der eigentliche Befund: die Zustimmungsseite liess sich einbetten. Wer sie in einen
# fremden Rahmen legt, schiebt einen eigenen Knopf ueber "Erlauben" und laesst einen
# Angemeldeten eine Freigabe erteilen, die er nie gesehen hat.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# Dasselbe fuer Browser, die frame-ancestors nicht kennen. Kostet eine Zeile.
add_header X-Frame-Options DENY always;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# **Ohne includeSubDomains und ohne preload.** Die Adresse ist eine Unterdomain von
# sliplane.app, und was dort sonst noch liegt, gehoert uns nicht. Ein Vorbehalt fuer
# fremde Dienste waere ein Uebergriff, und preload ist praktisch nicht ruecknehmbar.
add_header Strict-Transport-Security "max-age=31536000" always;
